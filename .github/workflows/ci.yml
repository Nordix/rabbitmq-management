name: CI

on:
  push:
    branches: [ 'v3.8.9-est' ]
  pull_request:
    branches: [ 'v3.8.9-est' ]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        otp: [ '21.3', '22.2' ]

    env:
      base_rmq_ref: v3.8.x
      current_rmq_ref: v3.8.9-est

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build CI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: OTP_VERSION=${{ matrix.otp }}
          tags: rabbitmq-ci:otp-${{ matrix.otp }}
          load: true
          cache-from: type=gha,scope=otp-${{ matrix.otp }}
          cache-to: type=gha,mode=max,scope=otp-${{ matrix.otp }}

      - name: Run checks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --hostname rabbitmq-ci \
            --env base_rmq_ref \
            --env current_rmq_ref \
            "rabbitmq-ci:otp-${{ matrix.otp }}" \
            bash -euo pipefail -c '
              # No ssh binary in the image; git_rmq uses an SSH push URL.
              git config --global url."https://github.com/".insteadOf git@github.com:
              git config --global --add safe.directory "*"
              make fetch-deps current_rmq_ref="$current_rmq_ref"
              make xref current_rmq_ref="$current_rmq_ref"
              epmd -daemon
              # Scoped for CVE CI: the CVE-2023-46118 regression test plus the
              # deterministic suites. The integration suites need more CPU than
              # the free hosted runner provides and are run locally.
              make ct-rabbit_mgmt_http current_rmq_ref="$current_rmq_ref" \
                t=all_tests_without_prefix:publish_large_message_exceeding_http_request_body_size_test
              DETERMINISTIC="cache config_schema listener_config \
                rabbit_mgmt_stats rabbit_mgmt_test_unit stats"
              make tests current_rmq_ref="$current_rmq_ref" \
                CT_SUITES="$DETERMINISTIC"
            '

